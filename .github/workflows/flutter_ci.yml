name: Flutter CI

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install root dependencies
        run: flutter pub get

      - name: Analyze root package
        run: flutter analyze

      - name: Run root tests with coverage
        run: flutter test --coverage

      - name: Install example dependencies
        run: |
          cd example
          flutter pub get

      - name: Analyze example app
        run: |
          cd example
          flutter analyze

